<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d3229">
<title>The Turner Story — English by the Nature Method</title>
<style>
  :root{
    --bg:#f3ecdd; --paper:#fffdf8; --ink:#2b2620; --muted:#8a7f6d; --border:#e4dbc8;
    --accent:#a8562c; --accent2:#3f7a5c; --warn:#c98a1d; --bad:#b8443a; --gold:#d9a441;
    --s1:#c96b3f; --s2:#3f6a8f; --s3:#2f8f7f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--ink); padding-bottom:70px;
    background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,0.6), transparent 40%);}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .screen{display:none; padding:20px 16px 26px; max-width:600px; margin:0 auto; animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pop{0%{transform:scale(.85);} 60%{transform:scale(1.05);} 100%{transform:scale(1);}}
  @keyframes wiggle{0%,100%{transform:rotate(0);} 25%{transform:rotate(-4deg);} 75%{transform:rotate(4deg);}}
  h1{font-size:1.4rem; margin:6px 0 4px; font-weight:700;}
  h2{font-size:1.1rem; margin:0 0 10px; font-weight:700;}
  .sub{color:var(--muted); font-size:0.86rem; margin:0 0 18px;}
  .hero{background:linear-gradient(135deg,#5a4636,#33281f); border-radius:20px; padding:22px; margin-bottom:18px;
    box-shadow:0 10px 26px rgba(60,40,20,0.25); position:relative; overflow:hidden;}
  .hero h1{color:#fdf6e8; margin:0 0 4px;}
  .hero p{color:#e6d9c2; margin:0; font-size:0.86rem;}
  .hero-badge{position:absolute; right:-10px; top:-10px; font-size:3.2rem; opacity:0.18; transform:rotate(12deg);}
  .card{background:var(--paper); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 6px rgba(0,0,0,0.04);}
  .btn{display:block; width:100%; text-align:center; background:linear-gradient(135deg,var(--accent),#8a4322); color:#fff; border:none; border-radius:10px;
    padding:13px; font-size:0.95rem; font-weight:700; cursor:pointer; margin-top:8px; box-shadow:0 4px 12px rgba(168,86,44,0.3);}
  .btn.secondary{background:transparent; box-shadow:none; border:1px solid var(--border); color:var(--ink);}
  .btn.small{padding:8px 12px; font-size:0.8rem; width:auto; display:inline-block; box-shadow:none;}
  .btn:active{transform:scale(0.98);}

  /* Story map */
  .map-wrap{position:relative; padding:6px 0 10px;}
  .series-title{font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; margin:22px 0 12px; display:flex; align-items:center; gap:8px;}
  .series-title .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .map-path{display:flex; flex-direction:column; gap:2px; position:relative; padding-left:6px;}
  .map-node{display:flex; align-items:center; gap:12px; position:relative; padding:8px 0; cursor:pointer;}
  .map-node.locked{cursor:not-allowed; opacity:0.42;}
  .map-node::before{content:""; position:absolute; left:20px; top:-14px; width:2px; height:14px; background:var(--border);}
  .map-node:first-child::before{display:none;}
  .map-circle{width:44px; height:44px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:1.3rem; border:3px solid var(--border); background:#fff; position:relative; z-index:1;}
  .map-circle.done{background:var(--accent2); border-color:var(--accent2); color:#fff;}
  .map-circle.current{border-color:var(--gold); box-shadow:0 0 0 4px rgba(217,164,65,0.25); animation:pop .6s ease;}
  .map-info .title{font-weight:700; font-size:0.9rem;}
  .map-info .meta{color:var(--muted); font-size:0.74rem; margin-top:1px;}
  .series-badge{display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--gold); color:#8a6d1f;
    padding:4px 10px; border-radius:99px; font-size:0.72rem; font-weight:700; margin-top:6px;}

  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px;}
  .stat{background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:10px 6px; text-align:center;}
  .stat .num{font-size:1.25rem; font-weight:800; color:var(--accent);}
  .stat .label{color:var(--muted); font-size:0.63rem; margin-top:2px;}

  /* Chapter reader */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .back{background:none; border:none; color:var(--accent); font-size:0.95rem; cursor:pointer; padding:6px 0; font-weight:600;}
  .illustration-frame{border-radius:16px; overflow:hidden; border:1px solid var(--border); margin-bottom:14px; box-shadow:0 4px 14px rgba(0,0,0,0.08);}
  .illustration-frame svg{display:block; width:100%; height:auto;}
  .cast-strip{display:flex; gap:10px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .cast-chip{display:flex; flex-direction:column; align-items:center; flex-shrink:0; width:52px;}
  .cast-chip svg{width:40px; height:40px; border-radius:50%; background:#fff; border:2px solid var(--border);}
  .cast-chip span{font-size:0.62rem; color:var(--muted); margin-top:3px; text-align:center;}
  .story-text{font-size:1.1rem; line-height:1.85;}
  .story-text p{margin:0 0 16px;}
  .gloss{background:#f3ead9; padding:1px 4px; border-radius:4px; border-bottom:2px dotted var(--accent); cursor:pointer; font-weight:600;}
  .gloss-popup{display:none; background:#2b2620; color:#fff; font-family:-apple-system,sans-serif; font-size:0.8rem;
    padding:8px 12px; border-radius:8px; margin:6px 0; line-height:1.4;}
  .gloss-popup.show{display:block; animation:fade .15s ease;}
  .spotlight{background:#fff7e6; border:1px dashed var(--gold); border-radius:12px; padding:12px 14px; margin:18px 0;
    font-size:0.86rem; line-height:1.55;}
  .spotlight b{color:#8a6d1f;}
  .spotlight .label{font-weight:700; color:#8a6d1f; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; display:block;}
  .grammar-note{background:#eef4ee; border-left:4px solid var(--accent2); border-radius:10px; padding:14px 16px; margin:18px 0; font-size:0.88rem; line-height:1.6;}
  .grammar-note h3{margin:0 0 6px; font-size:0.85rem; color:var(--accent2); text-transform:uppercase; letter-spacing:0.03em;}
  .listen-btn{background:linear-gradient(135deg,var(--accent2),#2c5c46); color:#fff; border:none; border-radius:10px; padding:9px 16px; font-size:0.82rem;
    font-weight:700; cursor:pointer; box-shadow:0 3px 10px rgba(63,122,92,0.3);}
  .listen-btn.playing{animation:wiggle 0.8s ease infinite;}

  .tab-row{display:flex; gap:6px; margin-bottom:16px;}
  .tab-btn{flex:1; padding:9px 4px; border-radius:10px; border:1px solid var(--border); background:var(--paper);
    font-size:0.76rem; font-weight:700; cursor:pointer; color:var(--muted);}
  .tab-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .vocab-list{font-size:0.86rem;}
  .vocab-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .vocab-row:last-child{border-bottom:none;}
  .vocab-emoji{font-size:1.3rem; width:30px; text-align:center;}
  .vocab-word{font-weight:700; color:var(--accent);}
  .vocab-def{color:var(--muted); margin-top:2px; font-size:0.8rem;}
  .vocab-actions{margin-left:auto; display:flex; gap:4px;}
  .icon-btn{border:none; background:#f3ead9; border-radius:8px; padding:5px 8px; font-size:0.85rem; cursor:pointer;}
  .icon-btn.active-yes{background:#dcf1e6;}
  .icon-btn.active-no{background:#fbe4e1;}

  /* Matching game */
  .match-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px;}
  .match-tile{background:#fff; border:2px solid var(--border); border-radius:12px; padding:12px 6px; text-align:center;
    font-size:0.82rem; cursor:pointer; min-height:56px; display:flex; align-items:center; justify-content:center; font-weight:600;}
  .match-tile .emoji{font-size:1.4rem; display:block; margin-bottom:2px;}
  .match-tile.selected{border-color:var(--gold); background:#fff7e6;}
  .match-tile.matched{border-color:var(--accent2); background:#e8f5ee; opacity:0.55; cursor:default;}
  .match-status{text-align:center; font-size:0.8rem; color:var(--muted); margin:10px 0;}

  .section-label{font-weight:700; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);
    margin:22px 0 8px; border-top:1px solid var(--border); padding-top:16px;}
  .exercise-block{}
  .blank-sentence{font-size:0.98rem; line-height:1.9; margin-bottom:16px;}
  select.blank{font-size:0.86rem; padding:3px 6px; border-radius:6px; border:2px solid var(--accent); background:#fff; color:var(--ink); margin:0 2px;}
  select.blank.correct{border-color:var(--accent2); background:#e8f5ee;}
  select.blank.wrong{border-color:var(--bad); background:#fbe9e7;}
  .q-item{margin-bottom:16px;}
  .q-item .q{font-weight:600; margin-bottom:6px; font-size:0.9rem;}
  .q-item textarea{width:100%; border:1px solid var(--border); border-radius:8px; padding:8px; font-family:inherit; font-size:0.88rem; min-height:50px;}
  .reveal-btn{font-size:0.78rem; color:var(--accent); background:none; border:none; cursor:pointer; padding:4px 0; font-weight:600;}
  .model-answer{display:none; background:#f3ead9; padding:8px 10px; border-radius:8px; font-size:0.84rem; margin-top:6px;}
  .model-answer.show{display:block;}
  .mc-item{margin-bottom:14px;}
  .mc-item .prompt{font-size:0.9rem; margin-bottom:8px; font-weight:600;}
  .mc-opt{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; margin-bottom:6px; font-size:0.86rem; cursor:pointer;}
  .mc-opt.correct{border-color:var(--accent2); background:#e8f5ee;}
  .mc-opt.wrong{border-color:var(--bad); background:#fbe9e7;}

  .navbar{position:fixed; bottom:0; left:0; right:0; background:rgba(255,253,248,0.97); backdrop-filter:blur(6px); border-top:1px solid var(--border);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  .navbar button{flex:1; background:none; border:none; color:var(--muted); font-size:0.62rem; padding:6px 0; cursor:pointer; font-weight:600;}
  .navbar button.active{color:var(--accent);}
  .navbar .icon{font-size:1.25rem; display:block;}

  .progressbar{height:8px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:16px;}
  .progressbar-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:99px; transition:width .35s;}
  .empty{color:var(--muted); font-size:0.88rem; text-align:center; padding:20px 0;}

  .badge-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .badge{background:#fff7e6; border:1px solid var(--gold); color:#8a6d1f; padding:6px 12px; border-radius:99px; font-size:0.78rem; font-weight:700;}

  /* Celebration overlay */
  #celebrate-overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:999; pointer-events:none;}
  #celebrate-overlay.show{display:flex;}
  .confetti-piece{position:absolute; top:-20px; width:8px; height:14px; opacity:0.9; animation:confettiFall linear forwards;}
  @keyframes confettiFall{ to { transform:translateY(110vh) rotate(540deg); opacity:0.2; } }
  .celebrate-card{background:#fff; border-radius:18px; padding:28px 24px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.25);
    animation:pop .4s ease; max-width:320px;}
  .celebrate-card .big{font-size:3rem;}
  .celebrate-card h3{margin:8px 0 4px; font-size:1.15rem;}
  .celebrate-card p{color:var(--muted); font-size:0.85rem; margin:0 0 14px;}
</style>
</head>
<body class="sans">

<div id="celebrate-overlay"></div>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="hero">
    <div class="hero-badge">📖</div>
    <h1>The Turner Story</h1>
    <p>An illustrated Nature Method course — no translation, one continuous story, from A2 to B2.</p>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="num" id="stat-chapters">0/15</div><div class="label">Chapters</div></div>
    <div class="stat"><div class="num" id="stat-words">0</div><div class="label">Words Known</div></div>
    <div class="stat"><div class="num" id="stat-streak">0</div><div class="label">🔥 Day Streak</div></div>
  </div>
  <div id="series-list"></div>
</div>

<!-- CHAPTER READ -->
<div class="screen" id="screen-chapter">
  <div class="topbar">
    <button class="back" onclick="exitChapter()">← Back</button>
    <button class="listen-btn" id="listen-btn" onclick="playChapterAudio()">🔊 Listen</button>
  </div>
  <h1 id="ch-title"></h1>
  <p class="sub" id="ch-meta"></p>
  <div class="tab-row">
    <button class="tab-btn active" data-tab="read" onclick="switchTab('read')">📖 Story</button>
    <button class="tab-btn" data-tab="vocab" onclick="switchTab('vocab')">🗂 Words</button>
    <button class="tab-btn" data-tab="play" onclick="switchTab('play')">🎮 Play</button>
    <button class="tab-btn" data-tab="exercises" onclick="switchTab('exercises')">✏️ Exercises</button>
  </div>
  <div id="tab-read"></div>
  <div id="tab-vocab" style="display:none;"></div>
  <div id="tab-play" style="display:none;"></div>
  <div id="tab-exercises" style="display:none;"></div>
</div>

<!-- PROGRESS -->
<div class="screen" id="screen-progress">
  <div class="topbar"><button class="back" onclick="showScreen('home')">← Back</button></div>
  <h1>📊 My Progress</h1>
  <div class="card">
    <h2>Badges</h2>
    <div class="badge-row" id="badge-row"></div>
  </div>
  <div class="card">
    <h2>Words I've Learned</h2>
    <div id="progress-words" class="vocab-list"></div>
  </div>
  <div class="card">
    <h2>Completed Chapters</h2>
    <div id="progress-chapters" class="vocab-list"></div>
  </div>
</div>

<div class="navbar">
  <button onclick="showScreen('home')" data-nav="home"><span class="icon">🏠</span>Story</button>
  <button onclick="showScreen('progress')" data-nav="progress"><span class="icon">📊</span>Progress</button>
</div>

<script>
/* ================= SVG SPRITE LIBRARY ================= */
let gradSeq = 0;
function nextId(){ gradSeq++; return "g"+gradSeq; }
function sky(topColor, bottomColor){
  const id = nextId();
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${topColor}"/><stop offset="100%" stop-color="${bottomColor}"/>
  </linearGradient></defs><rect x="0" y="0" width="400" height="200" fill="url(#${id})"/>`;
}
function sun(cx,cy){ return `<circle cx="${cx}" cy="${cy}" r="18" fill="#f6cf5e"/><circle cx="${cx}" cy="${cy}" r="24" fill="#f6cf5e" opacity="0.3"/>`; }
function moon(cx,cy){ return `<circle cx="${cx}" cy="${cy}" r="14" fill="#f3ecc9"/>`; }
function starField(){ let s=""; const pts=[[40,25],[90,15],[150,35],[260,20],[320,40],[360,15]]; pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="1.6" fill="#fff"/>`;}); return s; }
function cloud(cx,cy){ return `<g fill="#ffffff" opacity="0.85"><ellipse cx="${cx}" cy="${cy}" rx="20" ry="10"/><ellipse cx="${cx+16}" cy="${cy+3}" rx="14" ry="8"/><ellipse cx="${cx-16}" cy="${cy+4}" rx="13" ry="7"/></g>`; }
function ground(y,color){ return `<rect x="0" y="${y}" width="400" height="${200-y}" fill="${color}"/>`; }
function tree(x,y,scale){ scale=scale||1; return `<g transform="translate(${x},${y}) scale(${scale})">
    <rect x="-3" y="0" width="6" height="18" fill="#7a5230"/>
    <circle cx="0" cy="-8" r="16" fill="#5c9a5c"/><circle cx="-10" cy="-2" r="11" fill="#4f8a4f"/><circle cx="10" cy="-2" r="11" fill="#4f8a4f"/>
  </g>`; }
function flower(x,y,color){ return `<g transform="translate(${x},${y})">
    <rect x="-1" y="0" width="2" height="10" fill="#4f8a4f"/>
    <circle cx="0" cy="-3" r="4" fill="${color}"/><circle cx="-4" cy="0" r="3" fill="${color}"/><circle cx="4" cy="0" r="3" fill="${color}"/>
  </g>`; }
function house(x,y,scale,wall,roof){ scale=scale||1; return `<g transform="translate(${x},${y}) scale(${scale})">
    <rect x="-40" y="-40" width="80" height="50" fill="${wall}"/>
    <polygon points="-48,-40 0,-72 48,-40" fill="${roof}"/>
    <rect x="-12" y="-20" width="20" height="30" fill="#7a5230"/>
    <rect x="-32" y="-32" width="14" height="14" fill="#dff0f7" stroke="#5c4a38" stroke-width="1.5"/>
    <rect x="14" y="-32" width="14" height="14" fill="#dff0f7" stroke="#5c4a38" stroke-width="1.5"/>
  </g>`; }
function office(x,y,scale,color){ scale=scale||1; return `<g transform="translate(${x},${y}) scale(${scale})">
    <rect x="-46" y="-100" width="92" height="100" fill="${color}"/>
    ${[0,1,2,3].map(r=>[0,1,2,3].map(c=>`<rect x="${-38+c*22}" y="${-92+r*22}" width="14" height="14" fill="#cfe4f2" opacity="0.9"/>`).join('')).join('')}
  </g>`; }
function person(x,y,scale,opts){
  scale=scale||1; opts=opts||{};
  const skin=opts.skin||"#e8b98a", shirt=opts.shirt||"#3f6a8f", legs=opts.legs||"#43382d", hair=opts.hair||"#4a3324";
  let hairShape = "";
  if(opts.hairStyle==="pigtails"){
    hairShape = `<circle cx="-9" cy="-40" r="5" fill="${hair}"/><circle cx="9" cy="-40" r="5" fill="${hair}"/><path d="M-10,-46 Q0,-54 10,-46 Q10,-40 0,-40 Q-10,-40 -10,-46 Z" fill="${hair}"/>`;
  } else if(opts.hairStyle==="long"){
    hairShape = `<path d="M-13,-46 Q0,-56 13,-46 L13,-30 Q0,-34 -13,-30 Z" fill="${hair}"/>`;
  } else {
    hairShape = `<path d="M-12,-46 Q0,-56 12,-46 Q13,-40 0,-40 Q-13,-40 -12,-46 Z" fill="${hair}"/>`;
  }
  return `<g transform="translate(${x},${y}) scale(${scale})">
    <rect x="-7" y="-8" width="6" height="18" fill="${legs}"/><rect x="1" y="-8" width="6" height="18" fill="${legs}"/>
    <rect x="-13" y="-30" width="26" height="24" rx="6" fill="${shirt}"/>
    <circle cx="0" cy="-40" r="11" fill="${skin}"/>
    ${hairShape}
  </g>`;
}
function dog(x,y,scale,color){ scale=scale||1; color=color||"#b5793a"; return `<g transform="translate(${x},${y}) scale(${scale})">
    <ellipse cx="0" cy="-8" rx="16" ry="9" fill="${color}"/>
    <circle cx="16" cy="-14" r="8" fill="${color}"/>
    <ellipse cx="20" cy="-19" rx="3" ry="6" fill="${color}" transform="rotate(20 20 -19)"/>
    <path d="M-15,-4 Q-22,6 -14,10" stroke="${color}" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="-11" y="-2" width="4" height="9" fill="${color}"/><rect x="6" y="-2" width="4" height="9" fill="${color}"/>
  </g>`; }
function busShape(x,y,scale){ scale=scale||1; return `<g transform="translate(${x},${y}) scale(${scale})">
    <rect x="-45" y="-30" width="90" height="34" rx="6" fill="#c94f3e"/>
    <rect x="-38" y="-24" width="18" height="14" fill="#dff0f7"/><rect x="-14" y="-24" width="18" height="14" fill="#dff0f7"/>
    <rect x="10" y="-24" width="18" height="14" fill="#dff0f7"/>
    <circle cx="-28" cy="6" r="7" fill="#2b2620"/><circle cx="28" cy="6" r="7" fill="#2b2620"/>
  </g>`; }
function trainShape(x,y,scale,color){ scale=scale||1; color=color||"#3f6a8f"; return `<g transform="translate(${x},${y}) scale(${scale})">
    <rect x="-70" y="-40" width="140" height="42" rx="10" fill="${color}"/>
    ${[0,1,2,3].map(i=>`<rect x="${-58+i*36}" y="-32" width="22" height="16" fill="#dff0f7"/>`).join('')}
    <circle cx="-45" cy="6" r="9" fill="#2b2620"/><circle cx="0" cy="6" r="9" fill="#2b2620"/><circle cx="45" cy="6" r="9" fill="#2b2620"/>
  </g>`; }
function suitcase(x,y,scale,color){ scale=scale||1; color=color||"#a8562c"; return `<g transform="translate(${x},${y}) scale(${scale})">
    <rect x="-16" y="-22" width="32" height="24" rx="4" fill="${color}"/>
    <rect x="-6" y="-28" width="12" height="8" rx="2" fill="none" stroke="${color}" stroke-width="3"/>
    <rect x="-16" y="-12" width="32" height="3" fill="#3d2c1e"/>
  </g>`; }
function museumFacade(x,y,scale){ scale=scale||1; return `<g transform="translate(${x},${y}) scale(${scale})">
    <polygon points="-70,-56 0,-84 70,-56" fill="#d8cba8"/>
    <rect x="-72" y="-56" width="144" height="12" fill="#c7b98e"/>

/* ================= STATE ================= */
const STORAGE_KEY = "nm_state_v2";
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { completedChapters:{}, wordProgress:{}, lastVisit:null, streak:0 };
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
let state = loadState();

function updateStreak(){
  const today = new Date().toDateString();
  if(state.lastVisit !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    state.streak = (state.lastVisit === y.toDateString()) ? state.streak + 1 : 1;
    state.lastVisit = today;
    saveState();
  }
}
updateStreak();

/* ================= NAV ================= */
function showScreen(name){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
  document.querySelectorAll(".navbar button").forEach(b=>b.classList.remove("active"));
  const nb = document.querySelector('.navbar button[data-nav="'+name+'"]');
  if(nb) nb.classList.add("active");
  if(name==="home") renderHome();
  if(name==="progress") renderProgress();
}

function renderHome(){
  const doneCount = Object.keys(state.completedChapters).length;
  document.getElementById("stat-chapters").textContent = doneCount + "/" + CHAPTERS.length;
  const wordCount = Object.values(state.wordProgress).filter(w=>w.known).length;
  document.getElementById("stat-words").textContent = wordCount;
  document.getElementById("stat-streak").textContent = state.streak;

  const container = document.getElementById("series-list");
  container.innerHTML = "";
  let firstIncompleteFound = false;
  SERIES.forEach(s=>{
    const chs = CHAPTERS.filter(c=>c.series===s.id);
    const doneInSeries = chs.filter(c=>state.completedChapters[c.id]).length;
    const block = document.createElement("div");
    let html = `<div class="series-title"><span class="dot" style="background:${s.color}"></span>${s.title} — ${s.theme}</div>`;
    if(doneInSeries===chs.length){
      html += `<div class="series-badge">🏆 Series Complete!</div>`;
    }
    html += `<div class="map-path">`;
    chs.forEach(ch=>{
      const globalIndex = CHAPTERS.findIndex(c=>c.id===ch.id);
      const prevDone = globalIndex===0 || state.completedChapters[CHAPTERS[globalIndex-1].id];
      const done = state.completedChapters[ch.id];
      const locked = !prevDone && !done;
      const isCurrent = !done && prevDone && !firstIncompleteFound;
      if(isCurrent) firstIncompleteFound = true;
      html += `<div class="map-node ${locked?'locked':''}" ${locked?'':`onclick="openChapter(${ch.id})"`}>
        <div class="map-circle ${done?'done':''} ${isCurrent?'current':''}">${done?'✓':ch.emoji}</div>
        <div class="map-info">
          <div class="title">Ch. ${ch.id} — ${ch.title}</div>
          <div class="meta">${locked?'🔒 Finish the previous chapter to unlock':(done?'Completed':'Ready to start')}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
    block.innerHTML = html;
    container.appendChild(block);
  });
}

/* ================= CHAPTER READER ================= */
let currentChapter = null;
function openChapter(id){
  currentChapter = CHAPTERS.find(c=>c.id===id);
  showScreen("chapter");
  document.getElementById("ch-title").textContent = currentChapter.emoji + " Chapter " + currentChapter.id + ": " + currentChapter.title;
  const seriesInfo = SERIES.find(s=>s.id===currentChapter.series);
  document.getElementById("ch-meta").textContent = seriesInfo.title;
  switchTab('read');
  renderReadTab();
  renderVocabTab();
  renderPlayTab();
  renderExercisesTab();
}
function exitChapter(){ showScreen("home"); }

function switchTab(tab){
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector('.tab-btn[data-tab="'+tab+'"]').classList.add("active");
  document.getElementById("tab-read").style.display = tab==="read" ? "block":"none";
  document.getElementById("tab-vocab").style.display = tab==="vocab" ? "block":"none";
  document.getElementById("tab-play").style.display = tab==="play" ? "block":"none";
  document.getElementById("tab-exercises").style.display = tab==="exercises" ? "block":"none";
}

function glossify(text){
  return text.replace(/<g w='([^']+)'>([^<]+)<\/g>/g, (m, w, label)=>{
    return `<span class="gloss" onclick="toggleGloss(this,'${w.replace(/'/g,"\\'")}')">${label}</span>`;
  });
}
function toggleGloss(el, word){
  const existing = el.nextElementSibling;
  if(existing && existing.classList.contains('gloss-popup')){ existing.remove(); return; }
  document.querySelectorAll('.gloss-popup').forEach(p=>p.remove());
  const def = (currentChapter.glossary.find(g=>g.term===word)||{}).def || "";
  const popup = document.createElement('div');
  popup.className = 'gloss-popup show';
  popup.textContent = `${word} = ${def}`;
  el.insertAdjacentElement('afterend', popup);
}

function renderReadTab(){
  const el = document.getElementById("tab-read");
  let html = `<div class="illustration-frame">${ILLUSTRATIONS[currentChapter.id] ? ILLUSTRATIONS[currentChapter.id]() : ''}</div>`;
  html += castStrip(currentChapter.cast);
  html += `<div class="story-text">`;
  currentChapter.text.forEach(p=>{ html += `<p>${glossify(p)}</p>`; });
  html += `</div>`;
  if(currentChapter.spotlight){
    html += `<div class="spotlight"><span class="label">🔍 Look closely</span>${currentChapter.spotlight.quote}<br><br>${currentChapter.spotlight.hint}</div>`;
  }
  if(currentChapter.grammarNote){
    html += `<div class="grammar-note"><h3>${currentChapter.grammarNote.title}</h3><p>${currentChapter.grammarNote.text}</p></div>`;
  }
  el.innerHTML = html;
}

function renderVocabTab(){
  const el = document.getElementById("tab-vocab");
  let html = `<div class="vocab-list">`;
  currentChapter.vocab.forEach(([w,emoji,def])=>{
    const key = currentChapter.id+"_"+w;
    const prog = state.wordProgress[key];
    const known = prog && prog.known;
    html += `<div class="vocab-row">
      <div class="vocab-emoji">${emoji}</div>
      <div style="flex:1;">
        <div class="vocab-word">${w} ${known?'✓':''}</div>
        <div class="vocab-def">${def}</div>
      </div>
      <div class="vocab-actions">
        <button class="icon-btn ${known===false?'active-no':''}" onclick="markWord('${key}', false)">😕</button>
        <button class="icon-btn ${known===true?'active-yes':''}" onclick="markWord('${key}', true)">✅</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}
function markWord(key, known){
  state.wordProgress[key] = { known };
  saveState();
  renderVocabTab();
}

/* ---- Matching game (Play tab) ---- */
let matchState = null;
function renderPlayTab(){
  const el = document.getElementById("tab-play");
  const words = currentChapter.vocab.map(v=>({word:v[0], emoji:v[1]}));
  const wordTiles = words.map((w,i)=>({type:'word', text:w.word, pairId:i}));
  const emojiTiles = words.map((w,i)=>({type:'emoji', text:w.emoji, pairId:i}));
  let all = wordTiles.concat(emojiTiles);
  all = all.sort(()=>Math.random()-0.5);
  matchState = { tiles: all, selected:[], matched:[] };
  el.innerHTML = `<p class="sub">Match each word with its picture. Tap two tiles to check.</p>
    <div class="match-status" id="match-status">0 / ${words.length} matched</div>
    <div class="match-grid" id="match-grid"></div>`;
  renderMatchGrid();
}
function renderMatchGrid(){
  const grid = document.getElementById("match-grid");
  grid.innerHTML = matchState.tiles.map((t,i)=>{
    const isMatched = matchState.matched.includes(i);
    const isSelected = matchState.selected.includes(i);
    const content = t.type==='emoji' ? `<span class="emoji">${t.text}</span>` : t.text;
    return `<div class="match-tile ${isSelected?'selected':''} ${isMatched?'matched':''}" ${isMatched?'':`onclick="selectTile(${i})"`}>${content}</div>`;
  }).join('');
}
function selectTile(i){
  if(matchState.selected.includes(i) || matchState.matched.includes(i)) return;
  matchState.selected.push(i);
  renderMatchGrid();
  if(matchState.selected.length===2){
    const [a,b] = matchState.selected;
    const tileA = matchState.tiles[a], tileB = matchState.tiles[b];
    if(tileA.pairId===tileB.pairId && tileA.type!==tileB.type){
      matchState.matched.push(a,b);
      matchState.selected = [];
      document.getElementById("match-status").textContent = (matchState.matched.length/2) + " / " + (matchState.tiles.length/2) + " matched";
      renderMatchGrid();
    } else {
      setTimeout(()=>{ matchState.selected = []; renderMatchGrid(); }, 550);
    }
  }
}

function renderExercisesTab(){
  const el = document.getElementById("tab-exercises");
  let html = "";
  html += `<div class="exercise-block"><div class="section-label">Exercise A — Fill in the Blanks</div>`;
  let textA = currentChapter.exerciseA.text;
  currentChapter.exerciseA.blanks.forEach((b,i)=>{
    const opts = b.options.map(o=>`<option value="${o}">${o}</option>`).join('');
    const selectHtml = `<select class="blank" id="blankA${i}" data-answer="${b.answer}"><option value="">...</option>${opts}</select>`;
    textA = textA.replace(`<b${i+1}>`, selectHtml);
  });
  html += `<div class="blank-sentence">${textA}</div>`;
  html += `<button class="btn small" onclick="checkExerciseA()">Check Answers</button></div>`;

  html += `<div class="exercise-block"><div class="section-label">Exercise B — Comprehension Questions</div>`;
  currentChapter.exerciseB.questions.forEach((q,i)=>{
    html += `<div class="q-item">
      <div class="q">${i+1}. ${q.q}</div>
      <textarea placeholder="Write your answer in a full sentence..."></textarea>
      <button class="reveal-btn" onclick="this.nextElementSibling.classList.toggle('show')">Show a model answer</button>
      <div class="model-answer">${q.model}</div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="exercise-block"><div class="section-label">Exercise C — ${currentChapter.exerciseC.title}</div>`;
  currentChapter.exerciseC.items.forEach((it,i)=>{
    html += `<div class="mc-item"><div class="prompt">${i+1}. ${it.prompt}</div>`;
    it.options.forEach((opt,oi)=>{
      html += `<button class="mc-opt" onclick="checkMC(this, ${oi===it.correct})">${opt}</button>`;
    });
    html += `</div>`;
  });
  html += `</div>`;

  html += `<button class="btn" onclick="completeChapter()">✓ Mark Chapter as Complete</button>`;
  el.innerHTML = html;
}

function checkExerciseA(){
  currentChapter.exerciseA.blanks.forEach((b,i)=>{
    const sel = document.getElementById("blankA"+i);
    sel.classList.remove("correct","wrong");
    if(sel.value === b.answer) sel.classList.add("correct");
    else if(sel.value !== "") sel.classList.add("wrong");
  });
}
function checkMC(btn, isCorrect){
  const group = btn.parentElement.querySelectorAll(".mc-opt");
  group.forEach(b=>b.onclick=null);
  btn.classList.add(isCorrect ? "correct" : "wrong");
}

function completeChapter(){
  const wasAlreadyDone = !!state.completedChapters[currentChapter.id];
  state.completedChapters[currentChapter.id] = true;
  currentChapter.vocab.forEach(v=>{
    const key = currentChapter.id+"_"+v[0];
    if(!state.wordProgress[key]) state.wordProgress[key] = { known:true };
  });
  saveState();
  if(!wasAlreadyDone) celebrate();
  else showScreen("home");
}

function celebrate(){
  const overlay = document.getElementById("celebrate-overlay");
  const colors = ["#a8562c","#3f7a5c","#d9a441","#3f6a8f","#c9564f"];
  let confettiHtml = "";
  for(let i=0;i<40;i++){
    const left = Math.random()*100;
    const delay = Math.random()*0.4;
    const duration = 1.6 + Math.random()*1.2;
    const color = colors[i % colors.length];
    confettiHtml += `<div class="confetti-piece" style="left:${left}%; background:${color}; animation-duration:${duration}s; animation-delay:${delay}s;"></div>`;
  }
  const doneCount = Object.keys(state.completedChapters).length;
  overlay.innerHTML = confettiHtml + `<div class="celebrate-card">
    <div class="big">🎉</div>
    <h3>Chapter Complete!</h3>
    <p>You've finished ${doneCount} of ${CHAPTERS.length} chapters. Great progress!</p>
    <button class="btn" onclick="closeCelebrate()">Continue</button>
  </div>`;
  overlay.classList.add("show");
}
function closeCelebrate(){
  document.getElementById("celebrate-overlay").classList.remove("show");
  document.getElementById("celebrate-overlay").innerHTML = "";
  showScreen("home");
}

/* ================= AUDIO ================= */
function playChapterAudio(){
  if(!('speechSynthesis' in window) || !currentChapter) return;
  const btn = document.getElementById("listen-btn");
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); btn.classList.remove("playing"); return; }
  const plainText = currentChapter.text.map(p=>p.replace(/<g w='[^']+'>([^<]+)<\/g>/g, "$1")).join(" ");
  const utter = new SpeechSynthesisUtterance(plainText);
  utter.lang = "en-US";
  utter.rate = 0.92;
  utter.onstart = ()=>btn.classList.add("playing");
  utter.onend = ()=>btn.classList.remove("playing");
  speechSynthesis.speak(utter);
}

/* ================= PROGRESS SCREEN ================= */
function renderProgress(){
  const badgeRow = document.getElementById("badge-row");
  let badges = "";
  SERIES.forEach(s=>{
    const chs = CHAPTERS.filter(c=>c.series===s.id);
    const doneInSeries = chs.filter(c=>state.completedChapters[c.id]).length;
    if(doneInSeries===chs.length) badges += `<span class="badge">🏆 ${s.theme}</span>`;
  });
  const doneCount = Object.keys(state.completedChapters).length;
  if(doneCount >= 1) badges += `<span class="badge">📖 First Chapter</span>`;
  if(doneCount >= CHAPTERS.length) badges += `<span class="badge">👑 Whole Story Finished</span>`;
  if(state.streak >= 3) badges += `<span class="badge">🔥 ${state.streak}-Day Streak</span>`;
  badgeRow.innerHTML = badges || '<span class="empty" style="padding:4px 0;">Complete chapters to earn badges!</span>';

  const wordsEl = document.getElementById("progress-words");
  const knownWords = Object.entries(state.wordProgress).filter(([k,v])=>v.known);
  if(!knownWords.length){
    wordsEl.innerHTML = '<div class="empty">No words learned yet — start with Chapter 1!</div>';
  } else {
    wordsEl.innerHTML = knownWords.map(([k])=>{
      const word = k.split("_").slice(1).join("_");
      return `<div class="vocab-row"><span class="vocab-word">${word}</span></div>`;
    }).join('');
  }
  const chEl = document.getElementById("progress-chapters");
  const doneIds = Object.keys(state.completedChapters).map(Number).sort((a,b)=>a-b);
  if(!doneIds.length){
    chEl.innerHTML = '<div class="empty">No chapters completed yet.</div>';
  } else {
    chEl.innerHTML = doneIds.map(id=>{
      const ch = CHAPTERS.find(c=>c.id===id);
      return `<div class="vocab-row"><span class="vocab-word">${ch.emoji} Chapter ${ch.id}</span> — ${ch.title}</div>`;
    }).join('');
  }
}

/* ================= INIT ================= */
renderHome();
</script>
